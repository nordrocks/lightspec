<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SDD: граф</title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --hairline: #e1e0d9;
  --axis: #c3c2b7;
  --ring: rgba(11, 11, 11, 0.10);
  --wash: rgba(11, 11, 11, 0.04);
  /* Одна таблица цветов для обоих режимов: полосы карточек, рамки, стрелки, легенда. */
  --op-add: #1baf7a;    /* добавление */
  --op-mod: #2a78d6;    /* модификация */
  --op-del: #d03b3b;    /* удаление: пунктир */
  --op-none: #898781;   /* без изменений, история и обычные связи */
  --critical: #d03b3b;
  /* метки типов документации: свободные категориальные цвета, не занятые изменениями */
  --doc-domain: #898781;        /* документация поддомена — нейтральный */
  --doc-architecture: #6250d6;  /* violet */
  --doc-conventions: #e87ba4;   /* magenta */
  --doc-project: #008300;       /* green */
  --doc-adr: #eda100;           /* yellow */
  /* метки типов элементов контракта: та же палитра, другой столбец */
  --type-operation: #6250d6;
  --type-event: #eda100;
  --type-protocol: #e87ba4;
  --type-model: #898781;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7;
    --hairline: #2c2c2a; --axis: #383835; --ring: rgba(255, 255, 255, 0.10); --wash: rgba(255, 255, 255, 0.05);
    --op-add: #199e70; --op-mod: #3987e5;
    --doc-architecture: #9085e9; --doc-conventions: #d55181; --doc-adr: #c98500;
    --type-operation: #9085e9; --type-event: #c98500; --type-protocol: #d55181;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7;
  --hairline: #2c2c2a; --axis: #383835; --ring: rgba(255, 255, 255, 0.10); --wash: rgba(255, 255, 255, 0.05);
  --op-add: #199e70; --op-mod: #3987e5;
  --doc-architecture: #9085e9; --doc-conventions: #d55181; --doc-adr: #c98500;
  --type-operation: #9085e9; --type-event: #c98500; --type-protocol: #d55181;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
.viz-root {
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--text-primary); background: var(--page); min-height: 100vh;
  display: grid; grid-template-columns: 1fr 400px; grid-template-rows: auto 1fr;
}
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;
  padding: 12px 20px; border-bottom: 1px solid var(--hairline); background: var(--surface-1); }
h1 { font-size: 15px; margin: 0; font-weight: 600; }
.heading { display: flex; flex-direction: column; gap: 2px; }
#status { font-size: 12px; }
#status:empty { display: none; }
.toggle.back { border-color: var(--axis); }
.muted { color: var(--text-muted); }
.secondary { color: var(--text-secondary); }
/* переключатель вида: сегменты в общей рамке, своя полоса с чертой снизу */
.view-bar { position: relative; display: flex; justify-content: center; padding-bottom: 12px; margin: 0 0 16px; border-bottom: 1px solid var(--hairline); }
.tabs { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface-1); }
.tabs button { min-width: 96px; }
.tabs button, .toggle { font: inherit; color: var(--text-secondary); background: none; border: 1px solid transparent;
  border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.tabs button:hover { background: var(--wash); }
.tabs button[aria-selected="true"] { color: var(--text-primary); background: var(--wash); font-weight: 600; }
.column h3 .toggle { font-size: 11px; padding: 1px 6px; margin-left: 6px; border-color: var(--hairline); }
.column h3 .toggle.on { color: var(--text-primary); border-color: var(--axis); background: var(--wash); }
.live { margin-left: auto; color: var(--text-muted); }
.live.down { color: var(--critical); }
.banner { grid-column: 1 / -1; margin: 12px 20px 0; padding: 8px 12px; border-radius: 6px;
  border: 1px solid var(--critical); color: var(--text-primary); background: var(--surface-1); }
main { padding: 20px; overflow: auto; transition: opacity .2s; }
main.stale { opacity: .55; }
aside { border-left: 1px solid var(--hairline); background: var(--surface-1); padding: 16px 18px;
  overflow: auto; max-height: calc(100vh - 54px); position: sticky; top: 0; }

.ADDED { --mark: var(--op-add); }
.MODIFIED { --mark: var(--op-mod); }
.REMOVED { --mark: var(--op-del); }

/* вкладка 1 — домены */
.domains { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; align-items: start; }
.card { background: var(--surface-1); border: 1px solid var(--ring); border-radius: 8px; padding: 12px 14px; }
.card h2 { font-size: 14px; margin: 0 0 2px; font-weight: 600; }
.counts { color: var(--text-secondary); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.kind { margin: 10px 0 4px; color: var(--text-muted); font-size: 12px; }

/* карточка узла: заголовок, тип, операция — по строке */
.node { display: flex; gap: 8px; align-items: flex-start; width: 100%; text-align: left; font: inherit;
  color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--ring); border-radius: 6px;
  padding: 6px 8px 6px 6px; margin: 4px 0; cursor: pointer; position: relative; }
.node::before { content: ""; flex: none; width: 4px; align-self: stretch; border-radius: 2px; background: var(--mark, transparent); }
.node:hover, .node:focus-visible { background: linear-gradient(var(--wash), var(--wash)), var(--surface-1); outline: none; }
.node.selected { box-shadow: 0 0 0 2px var(--text-primary); }
.node.active { box-shadow: 0 0 0 2px var(--text-primary); }  /* режим фичи: спека или задача, чьи стрелки нарисованы */
.node.selected:not(.active) { box-shadow: 0 0 0 1.5px var(--axis); }
.node.context { border-color: var(--axis); color: var(--text-secondary); }
.node.context::before { display: none; }
.node.missing .label { font-style: italic; }
.node.REMOVED .label, .node.gone .label { text-decoration: line-through; text-decoration-color: var(--op-del); }
.node.gone { border: 1.5px dashed var(--op-del); }  /* пунктир — только удалённое из main */
.node.will-remove { border: 1.5px solid var(--op-del); }
.node.pending { border: 1.5px solid var(--op-add); }
.node .body { min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 1px; }
.line { font-size: 11px; color: var(--text-muted); }
.line.op { color: var(--text-secondary); }
.line b { font-weight: 700; }
.line.later { border-top: 1px solid var(--hairline); margin-top: 3px; padding-top: 3px; }
.line.later.removed { color: var(--op-del); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }

/* вкладка 2 — граф */
/* «Обозначения»: кнопка справа в полосе переключателя, панель поверх графа */
.legend-btn { position: absolute; right: 0; top: 0; border-color: var(--axis); }
.legend-btn.on { color: var(--text-primary); background: var(--wash); }
.legend-pop { position: absolute; right: 0; top: 36px; z-index: 5; width: 440px; max-height: 70vh; overflow: auto;
  background: var(--surface-1); border: 1px solid var(--axis); border-radius: 8px; padding: 10px 14px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .12); color: var(--text-secondary); font-size: 12px; }
.legend-pop h4 { margin: 8px 0 4px; font-size: 12px; color: var(--text-primary); }
.legend-pop h4:first-child { margin-top: 0; }
.legend-pop ul { list-style: none; padding-left: 0; margin: 0; }
.legend-pop li { display: flex; gap: 8px; align-items: center; margin: 3px 0; }
.legend-pop svg { flex: none; }
.sample-node { display: inline-block; width: 22px; height: 12px; border-radius: 3px; flex: none; }
.graph { position: relative; display: grid; gap: 72px; align-items: start; padding-right: 48px; }
.graph svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 0; }
.column { position: relative; z-index: 1; }
.column h3 { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 0 0 8px;
  padding-bottom: 6px; border-bottom: 1px solid var(--hairline); }
.group { margin-bottom: 14px; }
.group-name { font-size: 11px; color: var(--text-muted); margin: 6px 0 2px; }
.filter { width: 100%; font: inherit; font-size: 12px; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--hairline); border-radius: 6px; padding: 4px 8px; margin: 0 0 8px; }
.group-toggle { display: block; width: 100%; text-align: left; font: inherit; font-size: 11px; color: var(--text-muted);
  background: none; border: 0; padding: 2px 0; cursor: pointer; }
.group-toggle:hover { color: var(--text-primary); }
.column[data-col="plan"] .group[data-group="Задачи"] { border-top: 1px solid var(--axis); padding-top: 8px; margin-top: 4px; }
.edge { fill: none; stroke-width: 1.5; opacity: .85; transition: opacity .15s; }
.edge.emph { stroke-width: 2.6; opacity: 1; }
.edge.dim { opacity: .25; }

/* текст: markdown — отдельным блоком */
.md { font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; background: var(--page); border: 1px solid var(--hairline);
  border-radius: 6px; padding: 8px 12px; margin: 6px 0 10px; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h4, .md h5, .md h6 { margin: 12px 0 4px; font-size: 13px; font-weight: 600; }
.md h4 { font-size: 14px; }
.md p { margin: 6px 0; }
.md ul, .md ol { margin: 4px 0; padding-left: 20px; }
.md li { margin: 2px 0; }
.md code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--wash); padding: 0 3px; border-radius: 3px; }
.md table { border-collapse: collapse; margin: 6px 0; width: 100%; }
.md th, .md td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
.md th { font-weight: 600; color: var(--text-secondary); }
.md .props { color: var(--text-secondary); font-size: 12px; margin: 2px 0 6px; }
.md .lang { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
.md details.diagram { margin: 6px 0; }
.md details.diagram summary { cursor: pointer; color: var(--text-secondary); font-size: 12px; }
.md details.diagram summary:hover { color: var(--text-primary); }

/* панель деталей */
aside h2 { font-size: 14px; margin: 0 0 6px; overflow-wrap: anywhere; }
aside dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 10px 0; }
aside dt { color: var(--text-muted); }
aside dd { margin: 0; overflow-wrap: anywhere; }
aside pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-1); border: 1px solid var(--hairline);
  border-radius: 6px; padding: 8px 10px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
aside h3 { font-size: 12px; color: var(--text-secondary); margin: 14px 0 4px; font-weight: 600; }
aside ul { margin: 0; padding-left: 18px; }
.viz-root.wide { grid-template-columns: 1fr 680px; }
.wide-btn { float: right; font-size: 11px; padding: 1px 8px; border-color: var(--hairline); }
.ptabs { display: flex; gap: 4px; margin: 14px 0 0; border-bottom: 1px solid var(--hairline); }
.ptabs button { font: inherit; font-size: 12px; color: var(--text-secondary); background: none; border: 1px solid transparent;
  border-bottom: 0; border-radius: 6px 6px 0 0; padding: 4px 10px; cursor: pointer; }
.ptabs button[aria-selected="true"] { color: var(--text-primary); border-color: var(--hairline); background: var(--page); }
.link { font: inherit; color: var(--text-primary); background: none; border: 0; padding: 0; cursor: pointer;
  text-decoration: underline; text-decoration-color: var(--axis); text-align: left; }
</style>
</head>
<body>
<div class="viz-root">
  <header>
    <button class="toggle back" id="back-main" hidden>← весь main</button>
    <div class="heading"><h1 id="title">SDD: граф</h1><div id="status" class="secondary"></div></div>
    <span id="live" class="live">подключение…</span>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
  <aside id="detail"><p class="muted">Выбери фичу, задачу или блок — здесь будут его свойства, связи и текст.</p></aside>
</div>
<script>
const SIGN = { ADDED: "+", MODIFIED: "~", REMOVED: "−" };
const KINDS = { requirements: "требование", "domain-docs": "документация поддомена", contracts: "контракт",
  architecture: "архитектура", conventions: "конвенции", "project-doc": "документ проекта", adr: "ADR", task: "задача plan",
  feature: "фича", spec: "спека" };
const COLUMNS = [["features", "Фичи"], ["plan", "Спека и задачи plan"], ["req", "Требования"], ["contracts", "Контракты"], ["docs", "Документация и проект"]];
const EDGE_KINDS = { adds: "добавит", changes: "меняет", removes: "удалит", will_replace: "заменит", owns: "владелец",
  changed: "меняла раньше", removed: "удалила", gone: "меняла, позже удалён", replaced: "заменила", based: "опирается на",
  implements: "реализует", documents: "документация", contract: "выводит элемент", explains: "объясняет",
  uses: "использует модель", adr: "держится на ADR", replaces: "заменяет" };
// Связь глазами второго конца: для панели.
const EDGE_BACK = { adds: "добавит фича в работе", changes: "меняет фича в работе", removes: "удалит фича в работе",
  will_replace: "заменит фича в работе", owns: "владелец — фича", changed: "меняла раньше фича", removed: "удалён фичей",
  gone: "меняла фича", replaced: "заменён фичей", based: "основа для", implements: "реализует задача",
  documents: "описывает задачу", contract: "выведен из требования", explains: "объяснён в документации",
  uses: "модель для", adr: "на нём держится", replaces: "заменён" };

// Стили стрелок — одна таблица на оба режима. Цвет — переменная из CSS, dash — пунктир.
// Пунктир — только история закрытых фич: «меняла раньше» и блок, которого в main уже нет.
const STYLE = {
  add: { color: "--op-add", dash: false }, mod: { color: "--op-mod", dash: false }, del: { color: "--op-del", dash: false },
  own: { color: "--op-none", dash: false }, context: { color: "--op-none", dash: false },
  was: { color: "--op-none", dash: true }, gone: { color: "--op-del", dash: true },
};
// Общий режим: вид связи → стиль. Фича в работе: добавит — зелёный, изменит — синий, удалит — красный.
// Закрытая фича: владелец — серый, меняла раньше — серый пунктир, блок удалён из main — красный пунктир.
const MAIN_STYLE = { adds: "add", changes: "mod", removes: "del", will_replace: "del", owns: "own", changed: "was",
  removed: "gone", gone: "gone", replaced: "gone" };
// Режим фичи: стиль — по операции блока, на который указывает стрелка.
const ACTION_STYLE = { ADDED: "add", MODIFIED: "mod", REMOVED: "del" };

let graph = null, version = null, page = null, hovered = null, panelTab = "spec";
let pathTask = null;  // режим фичи: спека (стрелки всей фичи) или задача (её путь изменений)
let widePanel = localStorage.getItem("sdd-wide") === "1";  // правая панель шире
// Адрес страницы: #<вкладка>/<id выбранного узла>.
const VIEWS = ["changes", "graph"];
const [hashView, ...hashId] = location.hash.slice(1).split("/");
let view = VIEWS.includes(hashView) ? hashView : localStorage.getItem("sdd-view") || "changes";
let selected = hashId.length ? decodeURIComponent(hashId.join("/")) : null;
// Фича, открытая в общем режиме: граф её изменений. `graph <фича>` открывает страницу сразу на ней: `/?feature=<ID>`.
let focusFeature = new URLSearchParams(location.search).get("feature");
let pickSpec = !!focusFeature && !selected;  // при входе в режим фичи выбрать спеку, когда придёт граф
// Свёрнутые группы: «<столбец>:<группа>» — «features:archive», «req:auth», «docs:_project».
const collapsed = new Set(JSON.parse(localStorage.getItem("sdd-collapsed") || "[]"));
let featureFilter = "";  // строка фильтра под заголовком «Фичи»: часть ID или названия
let legendOpen = false;  // всплывающая панель «Обозначения»
const query = () => focusFeature ? "?feature=" + encodeURIComponent(focusFeature) : "";
let featureInfo = null;  // узел фичи из общего графа: «Нет в main» для панели спеки в режиме фичи

// Узел фичи из общего графа: история фичи, которой нет в графе её изменений.
async function loadFeatureInfo(slug) {
  featureInfo = null;
  if (!slug) return;
  try {
    const g = await (await fetch("/graph.json", { cache: "no-store" })).json();
    featureInfo = (g.nodes || []).find(n => n.id === "feature:" + slug) || null;
    renderDetail();
  } catch { /* панель без истории */ }
}

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let index = {};  // узлы по id: строится один раз на загрузку графа
const byId = () => index;
function setGraph(g) {
  graph = g;
  index = Object.fromEntries(g.nodes.map(n => [n.id, n]));
}
const domainName = d => d === "_project" ? "Проект" : d.startsWith("_contracts/") ? "Контракты: " + d.slice(11) : d;
const isMain = () => graph?.mode === "main";
const transient = n => (n.removed_block && !n.referenced) || n.pending;
const groupName = (col, g) => col === "features" ? ({ new: "в работе", archive: "закрыты" })[g] || g
  : col === "plan" ? (g === "Задачи" ? "задачи" : "") : col !== "docs" ? g : g === "_project" ? "проект" : "поддомен " + g;

// Метки типов: кружок перед подписью типа. Документация — по сущности, элемент контракта — по `Тип:`.
const DOC_DOTS = { "domain-docs": "--doc-domain", architecture: "--doc-architecture", conventions: "--doc-conventions",
  "project-doc": "--doc-project", adr: "--doc-adr" };
const TYPE_DOTS = { "операция": "--type-operation", "событие": "--type-event", "протокол": "--type-protocol",
  "модель": "--type-model" };
const dot = color => color ? `<i class="dot" style="background:var(${color})" aria-hidden="true"></i>` : "";
const dotOf = n => n.column === "docs" ? DOC_DOTS[n.kind] : n.kind === "contracts" ? TYPE_DOTS[n.type] : null;

// --- карточка: заголовок, кружок с типом, операция — по строке ---
function typeLine(n) {
  const name = n.kind === "contracts" ? n.type || KINDS.contracts : KINDS[n.kind] || n.kind;
  return `${dot(dotOf(n))}${esc(name)}`;
}

function opLine(n) {
  if (n.kind === "task") return n.done ? "☑ выполнена" : "☐ не выполнена";
  if (n.kind === "feature" || n.kind === "spec") return esc(n.status || "");
  if (n.removed_block) return `${n.replaced_with ? `заменён ADR ${esc(n.replaced_with)}` : "удалён из main"}${n.by ? " фичей " + esc(n.by) : ""}`;
  if (n.pending) return `добавит фича ${esc(n.by)}`;
  if (n.missing) return "нет в main";
  if (n.action) return `<b>${SIGN[n.action]}</b> ${n.action}`;
  return isMain() ? "" : "не меняется";
}

let removing = new Set();  // общий режим: блоки, которые удалит фича в фокусе

// Закрытая фича: что с частью стало в текущем main. Нижняя строка карточки.
function laterLine(n) {
  if (n.later_removed) return n.replaced_with
    ? `в текущем main заменён на ADR ${esc(n.replaced_with)} фичей ${esc(n.later_removed)}`
    : `в текущем main удалён фичей ${esc(n.later_removed)}`;
  if (n.later_changed) return `в текущем main изменён фичей ${esc(n.later_changed)}`;
  return "";
}

function nodeHtml(n) {
  const cls = ["node", removing.has(n.id) ? "will-remove" : "", n.action || "", !isMain() && !n.action && !["task", "spec"].includes(n.kind) ? "context" : "",
    n.missing ? "missing" : "", n.removed_block ? "gone" : "", n.pending ? "pending" : "",
    n.id === selected ? "selected" : "", !isMain() && n.id === pathTask ? "active" : ""].join(" ");
  const op = opLine(n), later = laterLine(n);
  return `<button class="${cls}" data-id="${esc(n.id)}"><span class="body"><span class="label">${esc(n.label)}</span>`
    + `<span class="line">${typeLine(n)}</span>${op ? `<span class="line op">${op}</span>` : ""}`
    + `${later ? `<span class="line later${n.later_removed ? " removed" : ""}">${later}</span>` : ""}</span></button>`;
}

// --- вкладка 1: домены и блоки ---
function renderChanges() {
  const changes = isMain() ? graph.nodes.filter(n => !n.missing && !transient(n) && n.kind !== "feature") : graph.nodes.filter(n => n.action);
  if (!changes.length) return `<p class="muted">${isMain() ? "В main нет блоков." : "В delta/ нет изменений."}</p>`;
  const rank = d => d === "_project" ? 2 : d.startsWith("_contracts/") ? 1 : 0;
  changes.sort((a, b) => rank(a.domain) - rank(b.domain) || a.domain.localeCompare(b.domain));
  const domains = new Map();
  for (const n of changes) (domains.get(n.domain) || domains.set(n.domain, []).get(n.domain)).push(n);
  return `<div class="domains">` + [...domains].map(([d, nodes]) => {
    const count = a => nodes.filter(n => n.action === a).length;
    const kinds = new Map();
    for (const n of nodes) (kinds.get(n.kind) || kinds.set(n.kind, []).get(n.kind)).push(n);
    return `<section class="card"><h2>${esc(domainName(d))}</h2>`
      + `<div class="counts">${isMain() ? `блоков: ${nodes.length}` : `+${count("ADDED")} ~${count("MODIFIED")} −${count("REMOVED")}`}</div>`
      + [...kinds].map(([k, ns]) => `<div class="kind">${esc(KINDS[k] || k)}</div>` + ns.map(nodeHtml).join("")).join("")
      + `</section>`;
  }).join("") + `</div>`;
}

// --- вкладка 2: граф ---
// Общий режим: фокус — выбранный узел, без выбора — наведённый. Выбор главнее наведения.
const focusId = () => isMain() ? selected || hovered : pathTask;

// Связанные с узлом: он сам и концы его связей.
function relatedTo(id) {
  if (!id) return null;
  return new Set([id, ...graph.edges.filter(e => e.from === id).map(e => e.to), ...graph.edges.filter(e => e.to === id).map(e => e.from)]);
}

// Режим фичи: путь изменений задачи — по направлению связей: задача → что она реализует и документирует → куда ведут их связи.
function taskPath(task) {
  const seen = new Set([task]), queue = [task];
  while (queue.length) {
    const id = queue.shift();
    for (const e of graph.edges) {
      if (e.from === id && !seen.has(e.to)) { seen.add(e.to); queue.push(e.to); }
    }
  }
  return seen;
}

// Что видно в графе и что поднять наверх столбцов.
function layout() {
  const nodes = byId(), focus = focusId();
  if (!isMain()) {
    const path = !pathTask ? null : byId()[pathTask]?.kind === "spec" ? new Set(graph.nodes.map(n => n.id)) : taskPath(pathTask);
    return { focus, related: path, shown: n => !path || ["task", "spec"].includes(n.kind) || path.has(n.id), top: new Set() };
  }
  const related = relatedTo(focus);
  const base = n => !transient(n) || (related && related.has(n.id));
  if (selected) return { focus, related, shown: n => base(n) && related.has(n.id), top: new Set() };
  // Наведение: связанное с узлом — наверх столбцов, кроме столбца самого узла.
  const col = nodes[focus]?.column;
  return { focus, related, shown: base, top: related ? new Set([...related].filter(id => nodes[id] && nodes[id].column !== col && id !== focus)) : new Set() };
}

const sampleLine = style => `<svg width="28" height="10" aria-hidden="true"><path d="M1,5 L27,5" stroke="var(${STYLE[style].color})" stroke-width="2"${STYLE[style].dash ? ' stroke-dasharray="4 3"' : ""}/></svg>`;
const sampleNode = (border, dashed) => `<i class="sample-node" style="border:1.5px ${dashed ? "dashed" : "solid"} var(${border})"></i>`;

// «Обозначения»: стрелки и карточки текущего режима, как пользоваться. Цвета кружков не нужны: тип подписан на карточке.
function legendHtml() {
  const arrows = isMain() ? [
    [sampleLine("add"), "фича в работе добавит блок"],
    [sampleLine("mod"), "фича в работе изменит блок"],
    [sampleLine("del"), "фича в работе удалит или заменит блок"],
    [sampleLine("own"), "закрытая фича — владелец: её версия в main (`Источник:`)"],
    [sampleLine("was"), "закрытая фича меняла блок раньше, сейчас там версия другой фичи"],
    [sampleLine("gone"), "закрытая фича удалила или заменила блок, его в main уже нет"],
    [sampleLine("own"), "связи блоков и фич: требование выводит элемент, элемент → модель, документация → элемент, блок → ADR, фича → основа"],
  ] : [
    [sampleLine("add"), "добавление"],
    [sampleLine("mod"), "модификация"],
    [sampleLine("del"), "удаление, а у «заменяет» — заменяемый ADR"],
    [sampleLine("context"), "к блоку без изменений"],
  ];
  const cards = isMain() ? [
    [sampleNode("--op-add", false), "блок, который фича в работе добавит. Виден, пока фича под курсором"],
    [sampleNode("--op-del", false), "блок, который фича в работе удалит"],
    [sampleNode("--op-del", true), "блок, удалённый из main. Виден вместе с фичей, которая его касалась"],
  ] : [
    [sampleNode("--axis", false), "блок main без изменений: без цветной полосы"],
    [sampleNode("--hairline", false), "закрытая фича: нижняя строка — что с частью в текущем main. Красным — удалена или заменена"],
  ];
  const hint = isMain()
    ? ["Наведение показывает связи узла и поднимает связанное наверх столбцов.", "Нажатие на фичу открывает её изменения.",
       "Нажатие на блок оставляет только его и связанное с ним, повторное — снимает выбор. Esc — тоже."]
    : ["Нажатие на спеку рисует стрелки всей фичи, на задачу — путь её изменений, повторное — снимает.",
       "Остальные карточки открываются в панели, выбор спеки или задачи остаётся.",
       "Цвет стрелки — операция блока, на который она указывает."];
  const section = (title, rows) => `<h4>${title}</h4><ul>${rows.map(([sample, text]) => `<li>${sample}<span>${esc(text)}</span></li>`).join("")}</ul>`;
  return `<div class="legend-pop" id="legend-pop"${legendOpen ? "" : " hidden"}>`
    + section("Стрелки", arrows) + section("Карточки", cards)
    + `<h4>Как пользоваться</h4><ul>${hint.map(h => `<li><span>${esc(h)}</span></li>`).join("")}</ul></div>`;
}

function renderGraph() {
  const { focus, shown: isShown, top } = layout();
  const feature = isMain() && byId()[focus]?.kind === "feature" ? focus : null;
  removing = new Set(feature ? graph.edges.filter(e => e.from === feature && ["removes", "will_replace"].includes(e.kind)).map(e => e.to) : []);
  const needle = featureFilter.trim().toLowerCase();
  const nodes = graph.nodes.filter(n => isShown(n) && (n.kind !== "feature" || !needle || n.label.toLowerCase().includes(needle)));
  const shown = COLUMNS.filter(([key]) => isMain() ? key !== "plan" : key !== "features");
  const cols = shown.map(([key, title]) => {
    const groups = new Map();
    const lifted = nodes.filter(n => n.column === key && top.has(n.id));
    if (lifted.length) groups.set("\u0000top", lifted);  // связанное с наведённым — первой группой
    for (const n of nodes.filter(n => n.column === key && !top.has(n.id))) (groups.get(n.group) || groups.set(n.group, []).get(n.group)).push(n);
    let body = [...groups].map(([g, ns]) => {
      const name = g === "\u0000top" ? "связано с " + (byId()[focus]?.label || "") : groupName(key, g);
      if (name && key !== "plan" && g !== "\u0000top") {
        // Группа сворачивается: заголовок — кнопка с числом карточек.
        const id = `${key}:${g}`, shut = collapsed.has(id);
        return `<div class="group" data-group="${esc(g)}"><button class="group-name group-toggle" data-collapse="${esc(id)}" aria-expanded="${!shut}">`
          + `${shut ? "▸" : "▾"} ${esc(name)} · ${ns.length}</button>${shut ? "" : ns.map(nodeHtml).join("")}</div>`;
      }
      return `<div class="group" data-group="${esc(g)}">${name ? `<div class="group-name">${esc(name)}</div>` : ""}${ns.map(nodeHtml).join("")}</div>`;
    }).join("") || `<p class="muted">—</p>`;
    const filter = key === "features"
      ? `<input id="feature-filter" class="filter" type="search" placeholder="фильтр по фиче" value="${esc(featureFilter)}" autocomplete="off">` : "";
    return `<section class="column" data-col="${key}"><h3>${title}</h3>${filter}${body}</section>`;
  }).join("");
  const markers = Object.entries(STYLE).map(([k, s]) => `<marker id="arrow-${k}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(${s.color})"/></marker>`).join("");
  return `<div class="graph" id="graph" style="grid-template-columns: repeat(${shown.length}, minmax(180px, 1fr))"><svg class="edges" aria-hidden="true"><defs>${markers}</defs></svg>${cols}</div>`;
}

function edgeStyle(e, nodes) {
  if (isMain()) return MAIN_STYLE[e.kind] || "own";
  // Цвет — по блоку, на который указывает стрелка. Он не меняется — серая.
  // Заменяемый ADR в delta не входит, но фича его удаляет — красная, как «заменит» в общем режиме.
  if (e.kind === "replaces") return "del";
  return ACTION_STYLE[nodes[e.to]?.action] || "context";
}

// Стрелки фокуса. Общий режим — связи узла в фокусе. Режим фичи — путь выбранной задачи, без задачи стрелок нет.
function drawEdges() {
  const { focus, related } = layout();
  const box = $("#graph");
  if (!box) return;
  const svg = $("svg.edges", box), origin = box.getBoundingClientRect();
  svg.querySelectorAll("path.edge").forEach(p => p.remove());
  const order = Object.fromEntries(COLUMNS.map(([k], i) => [k, i])), nodes = byId();
  const edges = !focus ? [] : isMain() ? graph.edges.filter(e => e.from === focus || e.to === focus)
    : graph.edges.filter(e => related.has(e.from) && related.has(e.to));
  for (const e of edges) {
    const a = box.querySelector(`.node[data-id="${CSS.escape(e.from)}"]`), b = box.querySelector(`.node[data-id="${CSS.escape(e.to)}"]`);
    if (!a || !b || !a.offsetParent || !b.offsetParent) continue;
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const ca = order[nodes[e.from].column], cb = order[nodes[e.to].column];
    const ya = ra.top + ra.height / 2 - origin.top, yb = rb.top + rb.height / 2 - origin.top;
    let d;
    if (ca === cb) {
      const x1 = ra.right - origin.left, x2 = rb.right - origin.left, bend = Math.max(x1, x2) + 36;
      d = `M${x1},${ya} C${bend},${ya} ${bend},${yb - (yb - ya) * 0.15} ${x2},${yb}`;
    } else {
      const fwd = ca < cb;
      const x1 = (fwd ? ra.right : ra.left) - origin.left, x2 = (fwd ? rb.left : rb.right) - origin.left;
      // Конец кривой — вдоль прямой от начала к концу: угол стрелки следует наклону линии.
      const mid = (x1 + x2) / 2, cx = x1 + (x2 - x1) * 0.7, cy = ya + (yb - ya) * 0.7;
      d = `M${x1},${ya} C${mid},${ya} ${cx},${cy} ${x2},${yb}`;
    }
    const style = edgeStyle(e, nodes), s = STYLE[style];
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d);
    // Режим фичи: стрелки карточки, открытой в панели из другого столбца, — толще, остальные — бледнее.
    const picked = !isMain() && selected && selected !== focus;
    const emph = picked && (e.from === selected || e.to === selected);
    p.setAttribute("class", "edge" + (emph ? " emph" : picked ? " dim" : ""));
    p.setAttribute("stroke", `var(${s.color})`);
    if (s.dash) p.setAttribute("stroke-dasharray", "4 4");
    p.setAttribute("marker-end", `url(#arrow-${style})`);
    svg.appendChild(p);
  }
}

// --- markdown ---
// Небольшой рендер для текста частей: заголовки, свойства, абзацы, списки, таблицы, fence, `код`, **жирный**.
// Ссылки `<вид>:<идентификатор>` на узлы графа — кнопки.
const REF = /(^|[^\w:/.-])((?:req|contract|adr|feature|doc):[A-Za-z0-9_./-]*[A-Za-z0-9])/g;

function inline(text) {
  const nodes = byId();
  return esc(text)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(REF, (m, pre, ref) => nodes[ref] ? `${pre}<button class="link" data-id="${esc(ref)}">${ref}</button>` : m);
}

function markdown(text) {
  const lines = text.split("\n"), out = [];
  let i = 0, para = [];
  const flush = () => { if (para.length) out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; };
  const isProp = l => /^[A-ZА-ЯЁ][A-Za-zА-Яа-яЁё]*( [A-Za-zА-Яа-яЁё]+)*: \S/.test(l);
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^(`{3,})(.*)$/);
    if (fence) {
      flush();
      const body = [];
      for (i++; i < lines.length && !(lines[i].startsWith(fence[1]) && /^`+$/.test(lines[i])); i++) body.push(lines[i]);
      i++;
      const code = `<pre>${esc(body.join("\n"))}</pre>`;
      if (fence[2].trim() === "mermaid") out.push(`<details class="diagram"><summary>диаграмма mermaid — показать</summary>${code}</details>`);
      else out.push((fence[2] ? `<div class="lang">${esc(fence[2])}</div>` : "") + code);
      continue;
    }
    const h = line.match(/^(#{1,3}) (.*)$/);
    if (h) {
      flush();
      out.push(`<h${h[1].length + 3}>${inline(h[2])}</h${h[1].length + 3}>`);
      const props = [];
      for (i++; i < lines.length && isProp(lines[i]); i++) props.push(lines[i]);
      if (props.length) out.push(`<div class="props">${props.map(inline).join("<br>")}</div>`);
      continue;
    }
    if (line.startsWith("|")) {
      flush();
      const rows = [];
      for (; i < lines.length && lines[i].startsWith("|"); i++) rows.push(lines[i].trim().slice(1, -1).split(/(?<!\\)\|/).map(c => c.trim()));
      const body = rows.filter((r, k) => !(k === 1 && r.every(c => /^:?-+:?$/.test(c))));
      out.push(`<table><thead><tr>${body[0].map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>`
        + body.slice(1).map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("") + `</tbody></table>`);
      continue;
    }
    if (/^\s*([-*]|\d+\.) /.test(line)) {
      flush();
      const items = [];
      for (; i < lines.length && (/^\s*([-*]|\d+\.) /.test(lines[i]) || (lines[i].startsWith("  ") && lines[i].trim())); i++) {
        const m = lines[i].match(/^(\s*)([-*]|\d+\.) (.*)$/);
        if (m) items.push({ depth: Math.floor(m[1].length / 2), ordered: /\d/.test(m[2]), text: m[3] });
        else if (items.length) items[items.length - 1].text += " " + lines[i].trim();
      }
      out.push(list(items, 0, 0).html);
      continue;
    }
    if (!line.trim()) { flush(); i++; continue; }
    para.push(line);
    i++;
  }
  flush();
  return out.join("");
}

// Вложенный список: пункты глубже текущего — внутрь предыдущего пункта.
function list(items, start, depth) {
  const tag = items[start].ordered ? "ol" : "ul";
  let html = `<${tag}>`, i = start;
  while (i < items.length && items[i].depth >= depth) {
    if (items[i].depth > depth) { const sub = list(items, i, items[i].depth); html = html.replace(/<\/li>$/, sub.html + "</li>"); i = sub.next; continue; }
    html += `<li>${inline(items[i].text)}</li>`;
    i++;
  }
  return { html: html + `</${tag}>`, next: i };
}

// --- панель ---
function renderDetail() {
  const el = $("#detail"), n = graph && byId()[selected];
  const wide = `<button class="toggle wide-btn" id="wide" title="Ширина панели">${widePanel ? "→ уже" : "← шире"}</button>`;
  if (!n) { el.innerHTML = wide + `<p class="muted">Выбери фичу, задачу или блок — здесь будут его свойства, связи и текст.</p>`; return; }
  const nodes = byId(), item = (id, verb) => `<li>${esc(verb)}: <button class="link" data-id="${esc(id)}">${esc(nodes[id]?.label ?? id)}</button></li>`;
  const links = [...graph.edges.filter(e => e.from === n.id).map(e => item(e.to, verb(e, nodes, false))),
    ...graph.edges.filter(e => e.to === n.id).map(e => item(e.from, verb(e, nodes, true)))];
  const where = n.kind === "task" ? "plan.md" : ["feature", "spec"].includes(n.kind) ? n.file
    : n.removed_block ? `удалён из main/${n.file}. Текст — версия фичи ${n.version}`
    : n.pending ? `добавит в main/${n.file}` : n.action ? `delta/${n.file}` : `main/${n.file}`;
  const rows = [["сущность", KINDS[n.kind] || n.kind], ["файл", where], n.owner && ["владелец", "sdd-" + n.owner],
    n.action && ["Источник", n.source ? "feature:" + n.source : "None"],
    isMain() && n.props?.["Источник"] && ["Источник", n.props["Источник"]], n.reason && n.reason !== "None" && ["Причина", n.reason]]
    .filter(Boolean);
  const op = opLine(n);
  const later = laterLine(n);
  el.innerHTML = wide + `<h2>${esc(n.label)}</h2>${op ? `<div class="line op">${op}</div>` : ""}`
    + (later ? `<div class="line${n.later_removed ? " later removed" : ""}">${later}</div>` : "")
    + `<dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`
    + (n.files?.length ? `<h3>Файлы</h3><ul>${n.files.map(f => `<li>${esc(f)}</li>`).join("")}</ul>` : "")
    + (links.length ? `<h3>Связи</h3><ul>${links.join("")}</ul>` : "")
    + goneHtml(n.kind === "spec" ? featureInfo?.gone : n.gone)
    + textHtml(n);
}

// Глагол связи для панели. Задача → часть delta: по операции части — добавляет, изменяет, удаляет.
const OP_VERB = { ADDED: "добавляет", MODIFIED: "изменяет", REMOVED: "удаляет" };
function verb(e, nodes, back) {
  const op = ["implements", "documents"].includes(e.kind) && OP_VERB[nodes[e.to]?.action];
  if (op) return back ? op + " задача" : op;
  return (back ? EDGE_BACK : EDGE_KINDS)[e.kind] || e.kind;
}

// «Нет в main»: части delta фичи, которых в main нет, и почему.
function goneHtml(gone) {
  return (gone?.length ? `<h3>Нет в main</h3><ul>${gone.map(g => `<li>${esc(g.name)} — ${esc(g.file)}: `
      + (g.open && g.action === "ADDED" ? "добавит при sync" : g.action === "REMOVED" && !g.by ? "удалила эта фича"
        : g.by && g.with ? `заменила фича ${esc(g.by)} на ADR ${esc(g.with)}` : g.by ? `удалила фича ${esc(g.by)}` : "блока больше нет") + `</li>`).join("")}</ul>` : "");
}

// Текст узла. У фичи и спеки — вкладки «Спека» и «План», у остальных — текст части.
function textHtml(n) {
  if (["feature", "spec"].includes(n.kind)) {
    const tabs = [["spec", "Спека", n.text], ...(n.plan ? [["plan", "План", n.plan]] : [])];
    const active = tabs.find(([k]) => k === panelTab) || tabs[0];
    return `<div class="ptabs" role="tablist">${tabs.map(([k, title]) => `<button data-ptab="${k}" aria-selected="${k === active[0]}">${title}</button>`).join("")}</div>`
      + `<div class="md">${markdown(active[2] || "")}</div>`;
  }
  if (!n.text) return "";
  return `<h3>Текст</h3><div class="md">${markdown(n.text)}</div>`;
}

// --- отрисовка и живое обновление ---
function render() {
  if (!graph || !graph.nodes) return;
  const f = graph.feature;
  $("#title").textContent = `${f.title}`;
  $("#status").textContent = f.status ? `Статус: ${f.status}` : "";
  $("#back-main").hidden = !focusFeature;
  document.title = `SDD: ${f.slug}`;
  if (selected && !byId()[selected]) selected = null;
  keepFilterFocus(() => { $("#view").innerHTML = tabsHtml() + (view === "graph" ? renderGraph() : renderChanges()); });
  history.replaceState(null, "", location.pathname + query() + "#" + view + (selected ? "/" + encodeURIComponent(selected) : ""));
  renderDetail();
  $(".viz-root").classList.toggle("wide", widePanel);
  if (view === "graph") requestAnimationFrame(drawEdges);
}

// Переключатель вида: по центру над графом и «Обозначениями».
function tabsHtml() {
  const tabs = [["changes", isMain() ? "Домены" : "Изменения"], ["graph", "Связи"]];
  return `<div class="view-bar"><nav class="tabs" role="tablist">${tabs.map(([k, title]) =>
    `<button role="tab" data-view="${k}" aria-selected="${k === view}">${title}</button>`).join("")}</nav>`
    + `<button class="toggle legend-btn${legendOpen ? " on" : ""}" id="legend-btn" aria-expanded="${legendOpen}">Обозначения</button>${legendHtml()}</div>`;
}

// Перерисовать только граф: при наведении панель не меняется.
function renderGraphOnly() {
  if (view !== "graph" || !graph) return;
  keepFilterFocus(() => { $("#view").innerHTML = tabsHtml() + renderGraph(); });
  requestAnimationFrame(drawEdges);
}

// Перерисовка заменяет поле фильтра: вернуть ему фокус и курсор.
function keepFilterFocus(redraw) {
  const input = document.activeElement?.id === "feature-filter" ? document.activeElement : null;
  const at = input?.selectionStart;
  redraw();
  if (input) { const next = $("#feature-filter"); next?.focus(); next?.setSelectionRange(at, at); }
}

// Открыть граф изменений фичи или вернуться к общему режиму: сразу перечитать граф.
function openFeature(slug) {
  focusFeature = slug;
  selected = null;
  pathTask = null;
  pickSpec = !!slug;
  loadFeatureInfo(slug);
  hovered = null;
  version = null;
  view = "graph";
  refresh();
}

function select(id) {
  selected = id;
  render();
}

let switches = null;  // счётчик переключений активной фичи на сервере: вырос — перейти на активную фичу

async function refresh() {
  try {
    const st = await (await fetch("/state" + query(), { cache: "no-store" })).json();
    // Агент начал работу над фичей (`graph <фича> --background`) — страница переходит на неё.
    if (switches !== null && st.switches !== switches) {
      switches = st.switches;
      if ((st.active || null) !== focusFeature) { openFeature(st.active || null); return; }
    }
    switches = st.switches;
    const v = st.version;
    $("#live").classList.remove("down");
    $("#view").classList.remove("stale");
    if (v !== version) {
      const g = await (await fetch("/graph.json" + query(), { cache: "no-store" })).json();
      if (page !== null && g.page !== page) { location.reload(); return; }
      page = g.page;
      version = g.version;
      $("#banner").hidden = !g.error;
      if (g.error) $("#banner").textContent = "Не удалось разобрать файлы, показан прошлый граф: " + g.error;
      else {
        setGraph(g);
        // Вход в режим фичи: спека выбрана сразу — стрелки всей фичи и её текст в панели.
        if (pickSpec && g.mode === "feature") { pathTask = selected = "spec:" + g.feature.slug; pickSpec = false; }
        render();
      }
    }
    $("#live").textContent = "● обновлено " + new Date().toLocaleTimeString("ru-RU");
  } catch {
    $("#live").textContent = "сервер недоступен";
    $("#live").classList.add("down");
    $("#view").classList.add("stale");
  }
}

document.addEventListener("click", ev => {
  if (ev.target.closest("#legend-btn")) { setLegend(!legendOpen); return; }
  if (legendOpen && !ev.target.closest("#legend-pop")) setLegend(false);  // клик мимо панели закрывает её
  if (ev.target.closest("#back-main")) { openFeature(null); return; }
  const fold = ev.target.closest("[data-collapse]");
  if (fold) {
    const g = fold.dataset.collapse;
    collapsed.has(g) ? collapsed.delete(g) : collapsed.add(g);
    localStorage.setItem("sdd-collapsed", JSON.stringify([...collapsed]));
    renderGraphOnly();
    return;
  }
  const ptab = ev.target.closest("[data-ptab]");
  if (ptab) { panelTab = ptab.dataset.ptab; renderDetail(); return; }
  const tab = ev.target.closest(".tabs button");
  if (tab) { view = tab.dataset.view; localStorage.setItem("sdd-view", view); render(); return; }
  if (ev.target.closest("#wide")) { widePanel = !widePanel; localStorage.setItem("sdd-wide", widePanel ? "1" : "0"); render(); return; }
  const node = ev.target.closest("[data-id]");
  if (node) {
    const id = node.dataset.id, n = byId()[id];
    if (!isMain()) {
      // Режим фичи: спека — стрелки всей фичи, задача — её путь. Повторное нажатие снимает.
      // Остальные карточки открываются в панели, выбор спеки или задачи остаётся.
      if (["task", "spec"].includes(n?.kind)) pathTask = pathTask === id ? null : id;
      select(id);
      return;
    }
    // Общий режим: нажатие на фичу открывает её изменения, на другой узел — выбирает его, повторное — снимает выбор.
    if (n?.kind === "feature") { openFeature(id.slice(8)); return; }
    hovered = null;
    select(id === selected ? null : id);
    return;
  }
  // Нажатие мимо узлов и элементов управления снимает выбор.
  if (ev.target.closest("#view") && !ev.target.closest("button, summary, a, input, details") && (selected || pathTask)) {
    pathTask = null; select(null);
  }
});
document.addEventListener("input", ev => {
  if (ev.target.id !== "feature-filter") return;
  featureFilter = ev.target.value;
  renderGraphOnly();
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && legendOpen) setLegend(false); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && (selected || pathTask)) { pathTask = null; select(null); } });
// Показать или скрыть «Обозначения» без перерисовки графа.
function setLegend(open) {
  legendOpen = open;
  $("#legend-pop")?.toggleAttribute("hidden", !open);
  $("#legend-btn")?.classList.toggle("on", open);
  $("#legend-btn")?.setAttribute("aria-expanded", open);
}
for (const type of ["mouseover", "focusin"]) document.addEventListener(type, ev => {
  const n = ev.target.closest?.("#graph .node");
  const id = n ? n.dataset.id : null;
  if (id === hovered || !isMain()) return;
  hovered = id;
  if (!selected) renderGraphOnly();  // выбор главнее наведения
});
new ResizeObserver(() => view === "graph" && drawEdges()).observe(document.body);

loadFeatureInfo(focusFeature);
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
